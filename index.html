<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BEAT · Cerebro</title>
<style>
  :root{
    --navy:#1E2270; --deep:#2B3590; --indigo:#3F489E; --blue:#335DAC; --light:#4E75B8;
    --gray:#8C8C8C; --ink:#14173D; --muted:#5B6180; --line:#DDE3F0; --soft:#F3F6FC; --card:#FFFFFF;
    --green:#1A7F4B; --amber:#B7791F; --red:#B42318; --bg:#F6F8FC;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:15px}
  header{background:var(--navy);color:#fff;padding:12px 16px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:5}
  header img{height:40px;background:#fff;border-radius:8px;padding:3px}
  header .t{font-weight:700;font-size:17px;line-height:1.1}
  header .s{font-size:12px;opacity:.75}
  header .who{margin-left:auto;font-size:12px;opacity:.85;text-align:right}
  nav{display:flex;gap:4px;background:var(--deep);padding:6px 10px;overflow-x:auto;position:sticky;top:64px;z-index:4}
  nav button{background:transparent;border:0;color:#cfd6f3;padding:9px 14px;border-radius:8px;font-size:14px;font-weight:600;white-space:nowrap;cursor:pointer}
  nav button.on{background:#fff;color:var(--navy)}
  main{max-width:1180px;margin:0 auto;padding:16px}
  .grid{display:grid;gap:12px}
  .kpis{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;border-top:4px solid var(--blue)}
  .kpi b{display:block;font-size:26px;color:var(--navy)}
  .kpi span{font-size:12px;color:var(--muted)}
  .kpi.real{border-top-color:var(--green)} .kpi.proy{border-top-color:var(--gray)}
  .tag{font-size:10px;font-weight:700;padding:2px 6px;border-radius:5px;margin-left:4px;vertical-align:middle}
  .tag.real{background:#E3F4EA;color:var(--green)} .tag.proy{background:#EEE;color:#555}
  .two{grid-template-columns:1fr} @media(min-width:860px){.two{grid-template-columns:1fr 1fr}}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
  .card h2{font-size:15px;margin:0 0 10px;color:var(--deep);display:flex;align-items:center;gap:8px}
  .row{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--soft);font-size:14px}
  .row:last-child{border-bottom:0}
  .row small{color:var(--muted)}
  .empty{color:var(--muted);font-size:13px;padding:6px 0}
  .bar{display:flex;align-items:center;gap:8px;margin:5px 0;font-size:13px}
  .bar .l{width:110px;color:var(--muted)} .bar .b{height:18px;border-radius:5px;background:var(--blue);min-width:2px}
  .bar .n{font-weight:700;color:var(--navy)}
  /* organigrama de agentes */
  .org{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
  .dep{border-radius:12px;padding:12px;color:#fff}
  .dep h3{margin:0 0 8px;font-size:14px;letter-spacing:.3px}
  .ag{background:rgba(255,255,255,.12);border-radius:8px;padding:7px 9px;margin-top:6px;font-size:12.5px}
  .ag b{display:block;font-size:13px}
  .ag .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#9be7b9;margin-right:6px}
  .ag .dot.off{background:rgba(255,255,255,.35)}
  .ceo{text-align:center;margin-bottom:12px}
  .ceo .box{display:inline-block;background:var(--navy);color:#fff;border-radius:12px;padding:10px 18px;font-weight:700}
  /* formularios */
  .actions{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
  .act{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:16px 12px;text-align:center;cursor:pointer;font-weight:700;color:var(--navy);font-size:14px}
  .act .i{font-size:26px;display:block;margin-bottom:6px}
  .act:hover,.act.on{border-color:var(--blue);background:var(--soft)}
  label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin:12px 0 4px}
  input,select,textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:9px;font-size:15px;font-family:inherit;background:#fff;color:var(--ink)}
  textarea{min-height:70px}
  .btn{background:var(--blue);color:#fff;border:0;border-radius:10px;padding:13px 18px;font-size:15px;font-weight:700;cursor:pointer;width:100%;margin-top:14px}
  .btn.sec{background:#fff;color:var(--blue);border:1px solid var(--blue)}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 12px;font-size:13px;cursor:pointer}
  .chip.on{background:var(--blue);border-color:var(--blue);color:#fff}
  .pill{font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px;white-space:nowrap}
  .p-Alta{background:#FDE2E1;color:var(--red)} .p-Media{background:#FDF1DC;color:var(--amber)} .p-Baja{background:#EEF2FA;color:var(--blue)}
  .lead{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px}
  .lead .top{display:flex;justify-content:space-between;gap:8px;align-items:start}
  .lead .n{font-weight:700;color:var(--navy)}
  .lead .m{font-size:12.5px;color:var(--muted);margin-top:3px}
  .lead details{margin-top:8px;font-size:13px} .lead summary{cursor:pointer;color:var(--blue);font-weight:600}
  .lead pre{white-space:pre-wrap;font-family:inherit;background:var(--soft);padding:10px;border-radius:8px;margin:6px 0}
  .lead .links a{margin-right:12px;color:var(--blue);font-weight:600;font-size:13px;text-decoration:none}
  .ficha{display:grid;grid-template-columns:110px 1fr;gap:4px 10px;font-size:13px;margin:8px 0}
  .ficha dt{color:var(--muted);font-weight:600} .ficha dd{margin:0;word-break:break-word}
  .ofr{margin:10px 0}
  .hacen{display:flex;gap:10px;align-items:center;background:var(--soft);border-radius:10px;padding:10px 12px;font-size:13.5px;margin:8px 0}
  .hacen .ic{font-size:22px}
  .recs{display:grid;gap:8px;grid-template-columns:1fr} @media(min-width:560px){.recs{grid-template-columns:1fr 1fr}}
  .rec{border:1px solid var(--line);border-left:4px solid var(--blue);border-radius:10px;padding:9px 11px;background:#fff}
  .rec .t{font-weight:700;color:var(--navy);font-size:13.5px;display:flex;gap:6px;align-items:center}
  .rec .w{font-size:12.5px;color:#3a3f5c;margin-top:3px}
  .rec .g{font-size:10.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);margin-top:4px}
  .ofr h5{font-size:12px;color:var(--muted);margin:12px 0 4px;text-transform:uppercase;letter-spacing:.4px}
  .ofr h4{margin:10px 0 4px;font-size:13px;color:var(--deep)}
  .ofr .it{display:inline-block;font-size:12px;padding:4px 8px;border-radius:7px;margin:2px 3px 2px 0;background:#F1F3F8;color:#8a90a8;border:1px solid transparent}
  .ofr .it.si{background:#E6EEFB;color:var(--navy);border-color:var(--light);font-weight:700}
  .ofr .it.si:before{content:'✓ '}
  .ofr .leg{font-size:11.5px;color:var(--muted)}
  /* ---- Producción / Planta ---- */
  .live{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);margin-bottom:10px}
  .live .dot{width:9px;height:9px;border-radius:50%;background:#2fbf71;box-shadow:0 0 0 0 rgba(47,191,113,.6);animation:pulse 1.6s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(47,191,113,.55)}70%{box-shadow:0 0 0 9px rgba(47,191,113,0)}100%{box-shadow:0 0 0 0 rgba(47,191,113,0)}}
  .linea{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
  .maq{background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px;text-align:center;position:relative}
  .maq.on{border-color:#2fbf71;box-shadow:0 0 0 2px rgba(47,191,113,.18)}
  .maq svg{width:100%;max-width:120px;height:78px;color:var(--deep)}
  .maq.on svg{color:var(--blue)}
  .maq .nm{font-weight:800;color:var(--navy);font-size:14px;margin-top:2px}
  .maq .st{font-size:11.5px;margin:3px 0 6px;color:var(--muted)}
  .maq.on .st{color:#1A7F4B;font-weight:700}
  .maq .job{background:var(--soft);border-radius:8px;padding:6px 7px;margin-top:6px;text-align:left;font-size:12px}
  .maq .job b{color:var(--navy)}
  .barra{height:8px;border-radius:5px;background:#E4E8F2;overflow:hidden;margin-top:4px}
  .barra i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--light));border-radius:5px;transition:width .6s}
  .barra.ok i{background:#2fbf71}
  .maq.on .gear{animation:spin 2.4s linear infinite;transform-origin:center;transform-box:fill-box}
  @keyframes spin{to{transform:rotate(360deg)}}
  .pcard{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px}
  .pcard .hd{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
  .pcard .ttl{font-weight:800;color:var(--navy)}
  .specs{display:flex;flex-wrap:wrap;gap:5px;margin:7px 0}
  .spec{font-size:11.5px;background:var(--soft);color:var(--deep);border-radius:6px;padding:3px 7px}
  .spec.dz{background:#FFF1DB;color:#8a5a12}
  .est{font-size:11px;font-weight:800;padding:4px 9px;border-radius:999px;white-space:nowrap}
  .est.Produciendo{background:#DDF5E8;color:#1A7F4B} .est.En.espera,.est.espera{background:#EEF1F7;color:#5B6180}
  .est.Pausado{background:#FDF1DC;color:#B7791F} .est.Terminado{background:#1A7F4B;color:#fff}
  .big{display:flex;align-items:center;gap:10px;margin:8px 0}
  .big .barra{flex:1;height:12px} .big b{font-size:18px;color:var(--navy);min-width:48px;text-align:right}
  .ruta{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-top:6px}
  .paso{text-align:center;font-size:10.5px;color:var(--muted)}
  .paso svg{width:100%;max-width:52px;height:34px;color:#B9C0D4}
  .paso.Terminado svg{color:#1A7F4B} .paso.Terminado{color:#1A7F4B}
  .paso.proceso svg{color:var(--blue)} .paso.proceso{color:var(--blue);font-weight:800}
  .paso.na{opacity:.45} .paso.na svg{color:#ccc}
  .paso .barra{height:5px}
  .ops .row{align-items:center}
  .ops .bts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
  .mini{border:1px solid var(--blue);background:#fff;color:var(--blue);border-radius:9px;padding:9px 12px;font-weight:700;font-size:13px;cursor:pointer}
  .mini.go{background:var(--blue);color:#fff} .mini.ok{background:#1A7F4B;border-color:#1A7F4B;color:#fff}
  .mini.gray{border-color:var(--line);color:var(--muted)}
  .pz{width:90px;padding:9px;border:1px solid var(--line);border-radius:9px;font-size:15px}
  /* ---- Semáforo y métricas ---- */
  .sem{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;white-space:nowrap}
  .sem.rojo{background:#FDE2E1;color:#B42318} .sem.amarillo{background:#FDF1DC;color:#8a5a12} .sem.verde{background:#DDF5E8;color:#1A7F4B} .sem.gris{background:#EEF1F7;color:#5B6180}
  .fechas{font-size:12px;color:var(--muted);margin-top:4px} .fechas b{color:var(--ink)}
  .luces{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .luz{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;text-align:center}
  .luz .c{width:46px;height:46px;border-radius:50%;margin:0 auto 6px;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:800;color:#fff}
  .luz .c.rojo{background:#E5484D;box-shadow:0 0 14px rgba(229,72,77,.45)} .luz .c.amarillo{background:#F5A524;box-shadow:0 0 14px rgba(245,165,36,.45)} .luz .c.verde{background:#2fbf71;box-shadow:0 0 14px rgba(47,191,113,.45)}
  .luz span{font-size:12.5px;color:var(--muted)}
  table.tb{width:100%;border-collapse:collapse;font-size:13px}
  .tb th{text-align:left;color:var(--muted);font-weight:700;font-size:11.5px;text-transform:uppercase;letter-spacing:.3px;padding:6px 6px;border-bottom:2px solid var(--line)}
  .tb td{padding:8px 6px;border-bottom:1px solid var(--soft);vertical-align:middle}
  .tb .num{text-align:right;white-space:nowrap}
  .tb .barra{height:7px;min-width:60px}
  .scroll{overflow-x:auto}
  .meses{display:flex;align-items:flex-end;gap:10px;height:150px;padding-top:10px}
  .mes{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;font-size:11px;color:var(--muted)}
  .mes .col{width:100%;max-width:46px;border-radius:6px 6px 0 0;background:var(--blue)}
  .mes b{font-size:12px;color:var(--navy)}
  @media print{nav,header .who,#toast{display:none!important}header{position:static}body{background:#fff}}
  /* ---- Tablero por áreas ---- */
  .area{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:14px}
  .area>h2{font-size:17px;margin:0 0 12px;color:var(--navy);display:flex;align-items:center;gap:8px}
  .area.com{border-top:5px solid var(--blue)} .area.pro{border-top:5px solid #B7791F}
  .embudo{display:grid;gap:6px;margin:6px 0 4px}
  .eb{display:flex;align-items:center;gap:10px}
  .eb .lb{width:130px;flex:none;font-size:13px;color:var(--muted)}
  .eb .br{height:30px;border-radius:8px;display:flex;align-items:center;padding:0 10px;color:#fff;font-weight:800;font-size:14px;min-width:36px}
  .eb .cv{font-size:11.5px;color:var(--muted);white-space:nowrap}
  .hbars .hb{display:grid;grid-template-columns:170px 1fr 70px;gap:8px;align-items:center;margin:5px 0;font-size:13px}
  .hbars .hb .b{height:16px;border-radius:5px;background:#E5484D}
  .hbars .hb .n{text-align:right;font-weight:700;color:var(--navy)}
  .maqs{display:grid;grid-template-columns:repeat(auto-fit,minmax(105px,1fr));gap:8px}
  .mq{text-align:center;border:1px solid var(--line);border-radius:12px;padding:8px}
  .mq svg{width:70px;height:46px;color:var(--deep)}
  .mq b{display:block;font-size:16px;color:var(--navy)} .mq small{color:var(--muted);font-size:11px}
  .mq .bad{color:#B42318;font-weight:800;font-size:12px}
  .defbox{background:#FFF1F0;border:1px solid #F5C2C0;border-radius:10px;padding:10px;margin:6px 0 10px}
  @media(max-width:560px){.hbars .hb{grid-template-columns:110px 1fr 56px}.eb .lb{width:96px}}
  /* ---- Tablero de flujo entre áreas ---- */
  .fl{width:100%;border-collapse:separate;border-spacing:0 6px;font-size:12.5px;min-width:1150px}
  .fl th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:#fff;background:var(--navy);padding:9px 8px}
  .fl th:first-child{border-radius:10px 0 0 10px} .fl th:last-child{border-radius:0 10px 10px 0}
  .fl td{background:#fff;padding:8px;vertical-align:top;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
  .fl td:first-child{border-left:1px solid var(--line);border-radius:10px 0 0 10px;min-width:150px}
  .fl td:last-child{border-right:1px solid var(--line);border-radius:0 10px 10px 0}
  .cel{border-radius:8px;padding:7px 8px;min-height:58px}
  .cel b{display:block;font-size:12px}
  .cel small{display:block;color:var(--muted);font-size:11px;margin-top:2px}
  .cel.lib{background:#E3F4EA} .cel.lib b{color:#1A7F4B}
  .cel.rec{background:#E6EEFB;border:1.5px solid var(--blue)} .cel.rec b{color:var(--blue)}
  .cel.por{background:#FFF4E0;border:1.5px dashed #E3A33B} .cel.por b{color:#8a5a12}
  .cel.nada{background:#F4F6FA;color:#aab1c6;text-align:center;line-height:42px}
  .cel button{margin-top:6px;width:100%;border:0;border-radius:7px;padding:7px 6px;font-weight:800;font-size:12px;cursor:pointer;color:#fff}
  .cel.rec button{background:var(--blue)} .cel.por button{background:#D98E1F}
  .flink{font-weight:800;color:var(--navy);cursor:pointer;text-decoration:underline dotted}
  .proms{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:12px}
  .prom{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
  .prom b{display:block;font-size:18px;color:var(--navy)} .prom small{display:block;color:var(--muted);font-size:11px}
  .prom.lento{border:2px solid #E5484D;background:#FFF5F5} .prom.lento b{color:#B42318}
  @media(max-width:700px){.proms{grid-template-columns:repeat(2,1fr)}}
  /* ---- Pendiente de fabricar ---- */
  .pend{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  @media(max-width:820px){.pend{grid-template-columns:1fr}}
  .pcol{border-radius:14px;padding:10px;border:1px solid var(--line);background:#fff}
  .pcol.rojo{border-top:6px solid #E5484D;background:#FFF8F8} .pcol.amarillo{border-top:6px solid #F5A524;background:#FFFCF4} .pcol.verde{border-top:6px solid #2fbf71;background:#F7FDF9}
  .pcol h3{margin:0 0 2px;font-size:15px} .pcol .tot{font-size:12px;color:var(--muted);margin-bottom:8px}
  .cli{background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 9px;margin-bottom:7px}
  .cli .cn{font-weight:800;color:var(--navy);font-size:13px}
  .cli .pd{font-size:12px;margin-top:5px;padding-top:5px;border-top:1px dashed var(--line)}
  .cli .pd .r1{display:flex;justify-content:space-between;gap:6px} .cli .pd small{color:var(--muted)}
  .area.ped{border-top:5px solid #3F489E} .area.prg{border-top:5px solid #4E75B8} .area.pen{border-top:5px solid var(--navy)}
  .lento{color:#B42318;font-weight:800}
  /* ---- Máquinas en movimiento (solo cuando están trabajando) ---- */
  .belt{stroke-dasharray:6 5}
  .maq.on .truck{animation:bache .5s ease-in-out infinite;transform-box:fill-box}
  @keyframes bache{50%{transform:translateY(-1.5px)}}
  .fila{margin-top:8px;text-align:left;font-size:11.5px;border-top:1px dashed var(--line);padding-top:6px}
  .fila .h{font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.3px;font-size:10.5px;margin-bottom:3px}
  .fila .it{display:grid;grid-template-columns:9px 1fr;gap:6px;align-items:start;padding:3px 0;line-height:1.3} .fila .it .dot{margin-top:4px}
  .dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none} .dot.rojo{background:#E5484D} .dot.amarillo{background:#F5A524} .dot.verde{background:#2fbf71} .dot.gris{background:#B9C0D4}
  .maq.on .belt,.paso.proceso .belt,.run .belt{animation:belt .7s linear infinite}
  @keyframes belt{to{stroke-dashoffset:-11}}
  .maq.on .gear,.paso.proceso .gear,.run .gear{animation:spin 1.6s linear infinite;transform-origin:center;transform-box:fill-box}
  .maq.on .press,.paso.proceso .press,.run .press{animation:press .9s ease-in-out infinite;transform-box:fill-box}
  @keyframes press{50%{transform:translateY(5px)}}
  .drip{opacity:0}
  .maq.on .drip,.paso.proceso .drip,.run .drip{animation:drip 1.1s ease-in infinite;transform-box:fill-box}
  @keyframes drip{0%{transform:translateY(-6px);opacity:0}30%{opacity:1}100%{transform:translateY(5px);opacity:0}}
  .maq.on .band,.paso.proceso .band,.run .band{animation:band 1.2s ease-in-out infinite}
  @keyframes band{50%{opacity:.35}}
  .barra.mov i{background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.35) 0 7px,transparent 7px 14px),linear-gradient(90deg,var(--blue),var(--light));background-size:20px 20px,100% 100%;animation:rayas .8s linear infinite}
  @keyframes rayas{to{background-position:20px 0,0 0}}
  @media (prefers-reduced-motion: reduce){.belt,.gear,.press,.drip,.band,.barra.mov i{animation:none!important}}
  #toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:12px 18px;border-radius:10px;font-size:14px;display:none;z-index:20;max-width:90vw}

function $(id){return document.getElementById(id)}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function money(n){return '$'+Math.round(n||0).toLocaleString('es-MX')}

function call(fn){var args=[].slice.call(arguments,1);return new Promise(function(ok,ko){var r=google.script.run.withSuccessHandler(ok).withFailureHandler(function(e){toast(e.message||e);ko(e)});r[fn].apply(r,args)})}
function store(k,v){try{v===undefined?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}}
function load(k){try{return localStorage.getItem(k)}catch(e){return null}}

function doLogin(c){
  CODE = (c||$('code').value).trim(); if(!CODE) return;
  call('uiLogin',CODE).then(function(u){
    store('beat_code',CODE); $('who').textContent=u.nombre+' · '+(u.rol||'');
    $('login').classList.add('hide'); $('app').classList.remove('hide'); show('tablero');
  }).catch(function(){ $('lerr').textContent='Código no válido'; store('beat_code'); });
}

document.querySelectorAll('nav button').forEach(function(b){b.onclick=function(){show(b.dataset.v)}});
function show(v){
  document.querySelectorAll('nav button').forEach(function(b){b.classList.toggle('on',b.dataset.v===v)});
  document.querySelectorAll('main section').forEach(function(s){s.classList.toggle('hide',s.id!=='v-'+v)});

function loadDash(v){

var TAB=null, TPER='30', EST_AREAS=['Ventas','Pedidos','Programación','Administración','Producción'];

function renderTablero(){

  var com='<div class="area com"><h2>🤝 Área comercial</h2>'+
    '<div class="grid two"><div><h4 style="margin:0 0 6px;font-size:13px;color:var(--muted)">EMBUDO DE VENTAS</h4><div class="embudo">'+

/* ---------- Combinar ---------- */
var CCOL=['#335DAC','#D98E1F'];
function ecNum(r){var m=String(r||'').match(/\d+/);return m?Number(m[0]):0}
function layouts(A,B,S){ // todas las formas de acomodar A (y B) en tiras a lo ancho del pliego
  var W=S.ancho-2*PRM.refile, Lg=S.largo, out=[];
  var orients=function(p){var o=[[p.dAncho,p.dLargo,false]];if(PRM.girar)o.push([p.dLargo,p.dAncho,true]);return o};
  orients(A).forEach(function(oa){(B?orients(B):[[0,0,false]]).forEach(function(ob){
    var nA=Math.floor(Lg/oa[1]), nB=B?Math.floor(Lg/ob[1]):0; if(nA<1||(B&&nB<1)) return;
    for(var kA=1;kA<=12;kA++){ if(kA*oa[0]>W) break;
      for(var kB=(B?1:0);kB<=(B?12:0);kB++){ if(kA*oa[0]+kB*ob[0]>W) break;
        out.push({kA:kA,kB:kB,nA:nA,nB:nB,pA:kA*nA,pB:kB*nB,oa:oa,ob:ob}); }}
  })});
  return out;
}
function mejorSolo(A,S){ // menos pliegos para cubrir A solo en el pliego S

}
function evalCombo(A,B,S,solo){
  var area=function(s){return s.ancho*s.largo}, best=null, disp=S.cantidad-S.apartados, sa=solo[A.folio], sb=solo[B.folio];
  if(!sa||!sb) return null;

    // se corre la combinación hasta completar el pedido que se acabe primero; el resto del otro se corta solo
    var n=Math.min(Math.ceil(A.cant/l.pA),Math.ceil(B.cant/l.pB));
    var remA=Math.max(0,A.cant-n*l.pA), remB=Math.max(0,B.cant-n*l.pB);
    var exA=remA?Math.ceil(remA/sa.pA):0, exB=remB?Math.ceil(remB/sb.pA):0;
    var total=n+exA+exB, areaTot=n*area(S)+exA*area(sa.S)+exB*area(sb.S);
    var util=A.cant*A.dAncho*A.dLargo+B.cant*B.dAncho*B.dLargo, merma=1-util/areaTot;
    var mismo=n+(sa.S.id===S.id?exA:0)+(sb.S.id===S.id?exB:0);
    var r={A:A,B:B,S:S,kA:l.kA,kB:l.kB,nA:l.nA,nB:l.nB,pA:l.pA,pB:l.pB,oa:l.oa,ob:l.ob,pliegos:n,exA:exA,exB:exB,total:total,merma:merma,
      mermaPl:1-(l.pA*A.dAncho*A.dLargo+l.pB*B.dAncho*B.dLargo)/area(S),alcanza:mismo<=disp,disp:disp,separados:sa.pliegos+sb.pliegos,
      sobraA:Math.max(0,n*l.pA+exA*sa.pA-A.cant),sobraB:Math.max(0,n*l.pB+exB*sb.pA-B.cant),soloA:sa,soloB:sb};
    r.ahorro=r.separados-r.total;

  });
  return best;
}
function calcularCombos(){
  var P=MPD.pedidos.filter(function(p){return COMB_SEL[p.folio]!==false&&p.dAncho>0&&p.dLargo>0&&!p.combinacion&&p.cant>0});
  var S=MPD.mp.filter(function(s){return s.cantidad-s.apartados>0});
  var compat=function(p,s){return (!p.corrugado||p.corrugado===s.corrugado)&&ecNum(s.resistencia)>=ecNum(p.resistencia)};
  var solo={};P.forEach(function(a){var b=null;S.forEach(function(s){if(!compat(a,s))return;var r=mejorSolo(a,s);if(r&&(!b||(r.alcanza&&!b.alcanza)||(r.alcanza===b.alcanza&&r.pliegos<b.pliegos)))b=r});solo[a.folio]=b});
  var res=[];

var MET=null, MET_PER='3m';
function loadMet(){ call('uiMetricas',CODE).then(function(d){MET=d;renderMet();}); }
function enPeriodo(f){ if(!f) return false; if(MET_PER==='todo') return true;
  var d=new Date(f+'T12:00:00'), h=new Date(), m={mes:0,'3m':2,'6m':5,'año':11}[MET_PER];
  var ini=new Date(h.getFullYear(),h.getMonth()-m,1); return d>=ini; }
function renderMet(){
  var all=MET||[];
  var cerr=all.filter(function(p){return p.sem&&p.sem.cumplio!==undefined&&enPeriodo(p.sem.cierre)});
  var aTiempo=cerr.filter(function(p){return p.sem.cumplio}).length, tarde=cerr.length-aTiempo;
  var otd=cerr.length?Math.round(aTiempo/cerr.length*100):null;
  var tardes=cerr.filter(function(p){return !p.sem.cumplio});
  var retProm=tardes.length?(tardes.reduce(function(s,p){return s+(p.sem.retraso||0)},0)/tardes.length).toFixed(1):'0';
  var act=all.filter(function(p){return p.sem&&p.sem.activo});
  var cR=act.filter(function(p){return p.sem.color==='rojo'}), cA=act.filter(function(p){return p.sem.color==='amarillo'}), cV=act.filter(function(p){return p.sem.color==='verde'});
  // por cliente
  var cli={}; cerr.forEach(function(p){var c=cli[p.empresa]=cli[p.empresa]||{n:0,ok:0,t:0,ret:0,act:0};c.n++;if(p.sem.cumplio)c.ok++;else{c.t++;c.ret+=p.sem.retraso||0}});
  act.forEach(function(p){var c=cli[p.empresa]=cli[p.empresa]||{n:0,ok:0,t:0,ret:0,act:0};c.act++;if(p.sem.color==='rojo')c.riesgo=(c.riesgo||0)+1});
  var filas=Object.keys(cli).map(function(k){var c=cli[k];return {k:k,n:c.n,ok:c.ok,t:c.t,pct:c.n?Math.round(c.ok/c.n*100):null,ret:c.t?(c.ret/c.t).toFixed(1):'—',act:c.act,riesgo:c.riesgo||0}})
    .sort(function(a,b){return b.t-a.t||b.riesgo-a.riesgo||(a.pct===null?1:0)-(b.pct===null?1:0)||(a.pct||0)-(b.pct||0)});
  // por mes (últimos 6)
  var meses=[],h=new Date();for(var i=5;i>=0;i--){var d=new Date(h.getFullYear(),h.getMonth()-i,1);meses.push(d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'))}
  var NM=['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
  var serie=meses.map(function(m){var x=all.filter(function(p){return p.sem&&p.sem.cumplio!==undefined&&String(p.sem.cierre).slice(0,7)===m});var ok=x.filter(function(p){return p.sem.cumplio}).length;return {m:m,n:x.length,pct:x.length?Math.round(ok/x.length*100):null}});
  var per=[['mes','Este mes'],['3m','3 meses'],['6m','6 meses'],['año','12 meses'],['todo','Todo']];
  var H='<div class="chips" style="margin-bottom:12px">'+per.map(function(p){return '<span class="chip '+(MET_PER===p[0]?'on':'')+'" onclick="MET_PER=\''+p[0]+'\';renderMet()">'+p[1]+'</span>'}).join('')+
    '<span class="chip" onclick="window.print()">🖨️ Imprimir para junta</span></div>'+
    '<div class="grid kpis">'+kpi(otd===null?'—':otd+'%','Entregas a tiempo','real','REAL')+kpi(cerr.length,'Pedidos entregados')+kpi(tarde,'Entregados tarde')+kpi(retProm+' d','Retraso promedio (tardes)')+kpi(act.length,'Pedidos activos')+'</div>'+
    '<div class="grid two" style="margin-top:12px"><div class="card"><h2>Semáforo de pedidos activos</h2><div class="luces">'+
      '<div class="luz"><div class="c rojo">'+cR.length+'</div><span>Riesgo alto / vencidos</span></div><div class="luz"><div class="c amarillo">'+cA.length+'</div><span>En riesgo</span></div><div class="luz"><div class="c verde">'+cV.length+'</div><span>Vamos bien</span></div></div>'+
      (cR.concat(cA).length?'<div style="margin-top:10px">'+cR.concat(cA).map(function(p){return '<div class="row"><div><b>'+esc(p.folio)+' · '+esc(p.empresa)+'</b><br><small>Compromiso '+esc(p.compromiso||'—')+' · estimada '+esc(p.estimada||'—')+' · '+p.avance+'%</small></div>'+semPill(p.sem)+'</div>'}).join('')+'</div>':'<div class="empty" style="margin-top:8px">Ningún pedido en riesgo. 👌</div>')+'</div>'+
    '<div class="card"><h2>Cumplimiento por mes</h2><div class="meses">'+serie.map(function(s){var mm=Number(s.m.slice(5))-1;
      return '<div class="mes"><b>'+(s.pct===null?'—':s.pct+'%')+'</b><div class="col" style="height:'+(s.pct||0)+'%;background:'+(s.pct===null?'#E4E8F2':s.pct>=90?'#2fbf71':s.pct>=75?'#F5A524':'#E5484D')+';min-height:4px"></div>'+NM[mm]+'<br>'+s.n+' ped.</div>'}).join('')+'</div>'+
      '<div class="leg" style="margin-top:8px;font-size:11.5px;color:var(--muted)">Verde ≥ 90% · Amarillo 75–89% · Rojo &lt; 75%</div></div></div>'+
    '<div class="card" style="margin-top:12px"><h2>Cumplimiento por cliente <small style="font-weight:400;color:var(--muted)">(los que más hemos incumplido arriba)</small></h2><div class="scroll"><table class="tb"><tr><th>Cliente</th><th class="num">Entregados</th><th class="num">A tiempo</th><th class="num">Tarde</th><th>% cumplimiento</th><th class="num">Retraso prom.</th><th class="num">Activos</th></tr>'+
      (filas.length?filas.map(function(f){return '<tr><td><b>'+esc(f.k)+'</b>'+(f.riesgo?' <span class="sem rojo" style="padding:2px 6px">🔴 '+f.riesgo+'</span>':'')+'</td><td class="num">'+f.n+'</td><td class="num">'+f.ok+'</td><td class="num" style="'+(f.t?'color:#B42318;font-weight:800':'')+'">'+f.t+'</td><td>'+(f.pct===null?'<small style="color:var(--muted)">sin entregas</small>':'<div style="display:flex;align-items:center;gap:6px">'+barra(f.pct,f.pct>=90)+'<b>'+f.pct+'%</b></div>')+'</td><td class="num">'+f.ret+(f.ret!=='—'?' d':'')+'</td><td class="num">'+f.act+'</td></tr>'}).join(''):'<tr><td colspan="7" class="empty">Todavía no hay pedidos. Las métricas se llenan solas conforme se capturan y entregan.</td></tr>')+
    '</table></div><div class="leg" style="margin-top:8px;font-size:11.5px;color:var(--muted)">A tiempo = se entregó en la fecha compromiso o antes. Si no se registró la fecha de entrega, se usa la fecha en que se terminó en planta.</div></div>';
  $('v-metricas').innerHTML=H;
}

      '<label>Corrugado</label>'+chipsField('f-cor',['Sencillo','Doble','Triple','Single-face'],'Doble')+
      '<label>Estilo</label>'+chipsField('f-est',['Caja regular','Otro'],'Caja regular')+
      '<div style="background:var(--soft);border-radius:10px;padding:4px 12px 12px;margin-top:10px"><label>📐 Desarrollo (medida del pliego por caja)</label><div id="f-des-calc" style="font-size:13px;color:var(--muted)">Escribe las medidas para calcularlo.</div>'+
      '<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:6px"><div><small style="color:var(--muted)">Ancho (cm) · opcional</small><input id="f-dan" inputmode="decimal" placeholder="automático"></div><div><small style="color:var(--muted)">Largo (cm) · opcional</small><input id="f-dla" inputmode="decimal" placeholder="automático"></div></div>'+
      '<div style="font-size:11.5px;color:var(--muted);margin-top:4px">Para caja regular se calcula solo. Si es otro estilo o planta lo midió distinto, escríbelo aquí.</div></div>'+
      '<label>Volumen (piezas)</label><input id="f-cant" inputmode="numeric">'+
      '<label>Fecha compromiso de entrega</label><input type="date" id="f-fecha"><label>Notas</label><textarea id="f-det"></textarea>';
    if(t==='etapa') h='<label>Pedido</label><select id="f-folio">'+PEDIDOS.map(function(p){return '<option '+(p['Folio']===folio?'selected':'')+' value="'+esc(p['Folio'])+'">'+esc(p['Folio'])+' · '+esc(p['Empresa'])+'</option>'}).join('')+'</select><label>Nueva etapa</label>'+chipsField('f-etapa',['Confirmado','En producción','Listo','En ruta','Entregado','Facturado','Cancelado'])+'<label>Fecha de entrega (si ya se entregó; vacío = hoy)</label><input type="date" id="f-fent"><label>Notas</label><textarea id="f-det"></textarea>';
    if(t==='lead') h='<label>Empresa</label><input id="f-emp"><label>Giro</label><input id="f-giro"><label>Contacto (nombre / puesto)</label><input id="f-cont"><label>Teléfono</label><input id="f-tel" inputmode="tel"><label>Correo</label><input id="f-mail" inputmode="email"><label>¿Cómo llegó o qué necesita?</label><textarea id="f-det"></textarea>';
    if(t==='nota') h=leadSelect(leadId)+'<label>Nota</label><textarea id="f-det"></textarea>';
    f.innerHTML=h+'<button class="btn" id="f-go" onclick="send(\''+t+'\')">Guardar</button>'; f.style.display='block';
    if(t==='pedido'){var dz=$('f-dis');if(dz)dz.addEventListener('click',function(){setTimeout(function(){$('pc-box').style.display=chipVal('f-dis')==='Sí'?'block':'none'},0)});
      ['f-lar','f-anc','f-alt'].forEach(function(id){$(id).addEventListener('input',desCalc)});['f-med','f-uni','f-cor','f-est'].forEach(function(id){$(id).addEventListener('click',function(){setTimeout(desCalc,0)})});}
    if(t!=='pedido'||leadId) f.scrollIntoView({behavior:'smooth',block:'start'});
  };
  if(t==='etapa'&&!PEDIDOS.length) call('uiPedidos',CODE).then(function(p){PEDIDOS=p;go()}); else if(!LEADS.length&&t!=='lead') loadLeads().then(go); else go();
}
function v(id){var e=$(id);return e?e.value.trim():''}
function send(t){
  var d={tipo:t,leadId:v('f-lead'),detalle:v('f-det'),canal:chipVal('f-canal'),fecha:v('f-fecha')};
  if(t==='respuesta') d.resultado=chipVal('f-res');
  if(t==='contacto') d.subtipo=chipVal('f-sub');
  if(t==='pedido'){d.empresa=v('f-emp');d.producto=v('f-prod');d.cantidad=v('f-cant');d.diseno=chipVal('f-dis');d.medidas=chipVal('f-med');d.largo=v('f-lar');d.ancho=v('f-anc');d.alto=v('f-alt');d.unidad=chipVal('f-uni');d.resistencia=chipVal('f-res2');d.corrugado=chipVal('f-cor');d.estilo=chipVal('f-est');d.desAncho=v('f-dan');d.desLargo=v('f-dla');}
  if(t==='etapa'){d.folio=v('f-folio');d.etapa=chipVal('f-etapa');d.fechaEntrega=v('f-fent');}
  if(t==='lead'){d.empresa=v('f-emp');d.giro=v('f-giro');d.contacto=v('f-cont');d.tel=v('f-tel');d.email=v('f-mail');}
  if(['enviado','respuesta','contacto'].indexOf(t)>=0&&!d.leadId) return toast('Elige la empresa');
  if(t==='respuesta'&&!d.resultado) return toast('Elige qué dijo');
  if(t==='pedido'&&!d.leadId&&!d.empresa) return toast('Elige o escribe la empresa');
  if(t==='pedido'&&!d.resistencia) return toast('Elige la resistencia');
  if(t==='pedido'&&!(Number(d.cantidad)>0)) return toast('Escribe el volumen en piezas');
  if(t==='etapa'&&!d.etapa) return toast('Elige la etapa');
  if(t==='lead'&&!d.empresa) return toast('Escribe la empresa');
  $('f-go').disabled=true; $('f-go').textContent='Guardando…';
  var pcIn=$('f-pc');
  if(t==='pedido'&&d.diseno==='Sí'&&pcIn&&pcIn.files&&pcIn.files[0]){
    var fl=pcIn.files[0]; if(fl.size>10*1024*1024){$('f-go').disabled=false;$('f-go').textContent='Guardar';return toast('El printcard pesa más de 10 MB');}
    return leerArchivo(fl).then(function(pc){d.printcard=pc;enviar(t,d)});
  }
  enviar(t,d);
}
function enviar(t,d){
  call('uiCapture',CODE,d).then(function(msg){toast('✅ '+msg);LEADS=[];PEDIDOS=[];var fm=$(formFor(t));if(t==='pedido'){pick('pedido');window.scrollTo(0,0);}else if(fm){fm.style.display='none';}document.querySelectorAll('.act').forEach(function(a){a.classList.remove('on')});loadLeads().then(function(){if($('leads-box'))renderLeads();});})
    .catch(function(){$('f-go').disabled=false;$('f-go').textContent='Guardar'});
}

var saved=load('beat_code'); if(saved) doLogin(saved);
$('code').addEventListener('keydown',function(e){if(e.key==='Enter')doLogin()});
</script>
</body>
</html>
