<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BEAT · Cerebro</title>
<style>
  :root{
    --navy:#1E2270; --deep:#2B3590; --indigo:#3F489E; --blue:#335DAC; --light:#4E75B8;
    --gray:#8C8C8C; --ink:#14173D; --muted:#5B6180; --line:#DDE3F0; --soft:#F3F6FC; --card:#FFFFFF;
    --green:#1A7F4B; --amber:#B7791F; --red:#B42318; --bg:#F6F8FC;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:15px}
  header{background:var(--navy);color:#fff;padding:12px 16px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:5}
  header img{height:40px;background:#fff;border-radius:8px;padding:3px}
  header .t{font-weight:700;font-size:17px;line-height:1.1}
  header .s{font-size:12px;opacity:.75}
  header .who{margin-left:auto;font-size:12px;opacity:.85;text-align:right}
  nav{display:flex;gap:4px;background:var(--deep);padding:6px 10px;overflow-x:auto;position:sticky;top:64px;z-index:4}
  nav button{background:transparent;border:0;color:#cfd6f3;padding:9px 14px;border-radius:8px;font-size:14px;font-weight:600;white-space:nowrap;cursor:pointer}
  nav button.on{background:#fff;color:var(--navy)}
  main{max-width:1180px;margin:0 auto;padding:16px}
  .grid{display:grid;gap:12px}
  .kpis{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;border-top:4px solid var(--blue)}
  .kpi b{display:block;font-size:26px;color:var(--navy)}
  .kpi span{font-size:12px;color:var(--muted)}
  .kpi.real{border-top-color:var(--green)} .kpi.proy{border-top-color:var(--gray)}
  .tag{font-size:10px;font-weight:700;padding:2px 6px;border-radius:5px;margin-left:4px;vertical-align:middle}
  .tag.real{background:#E3F4EA;color:var(--green)} .tag.proy{background:#EEE;color:#555}
  .two{grid-template-columns:1fr} @media(min-width:860px){.two{grid-template-columns:1fr 1fr}}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
  .card h2{font-size:15px;margin:0 0 10px;color:var(--deep);display:flex;align-items:center;gap:8px}
  .row{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--soft);font-size:14px}
  .row:last-child{border-bottom:0}
  .row small{color:var(--muted)}
  .empty{color:var(--muted);font-size:13px;padding:6px 0}
  .bar{display:flex;align-items:center;gap:8px;margin:5px 0;font-size:13px}
  .bar .l{width:110px;color:var(--muted)} .bar .b{height:18px;border-radius:5px;background:var(--blue);min-width:2px}
  .bar .n{font-weight:700;color:var(--navy)}
  /* organigrama de agentes */
  .org{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
  .dep{border-radius:12px;padding:12px;color:#fff}
  .dep h3{margin:0 0 8px;font-size:14px;letter-spacing:.3px}
  .ag{background:rgba(255,255,255,.12);border-radius:8px;padding:7px 9px;margin-top:6px;font-size:12.5px}
  .ag b{display:block;font-size:13px}
  .ag .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#9be7b9;margin-right:6px}
  .ag .dot.off{background:rgba(255,255,255,.35)}
  .ceo{text-align:center;margin-bottom:12px}
  .ceo .box{display:inline-block;background:var(--navy);color:#fff;border-radius:12px;padding:10px 18px;font-weight:700}
  /* formularios */
  .actions{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
  .act{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:16px 12px;text-align:center;cursor:pointer;font-weight:700;color:var(--navy);font-size:14px}
  .act .i{font-size:26px;display:block;margin-bottom:6px}
  .act:hover,.act.on{border-color:var(--blue);background:var(--soft)}
  label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin:12px 0 4px}
  input,select,textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:9px;font-size:15px;font-family:inherit;background:#fff;color:var(--ink)}
  textarea{min-height:70px}
  .btn{background:var(--blue);color:#fff;border:0;border-radius:10px;padding:13px 18px;font-size:15px;font-weight:700;cursor:pointer;width:100%;margin-top:14px}
  .btn.sec{background:#fff;color:var(--blue);border:1px solid var(--blue)}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 12px;font-size:13px;cursor:pointer}
  .chip.on{background:var(--blue);border-color:var(--blue);color:#fff}
  .pill{font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px;white-space:nowrap}
  .p-Alta{background:#FDE2E1;color:var(--red)} .p-Media{background:#FDF1DC;color:var(--amber)} .p-Baja{background:#EEF2FA;color:var(--blue)}
  .lead{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px}
  .lead .top{display:flex;justify-content:space-between;gap:8px;align-items:start}
  .lead .n{font-weight:700;color:var(--navy)}
  .lead .m{font-size:12.5px;color:var(--muted);margin-top:3px}
  .lead details{margin-top:8px;font-size:13px} .lead summary{cursor:pointer;color:var(--blue);font-weight:600}
  .lead pre{white-space:pre-wrap;font-family:inherit;background:var(--soft);padding:10px;border-radius:8px;margin:6px 0}
  .lead .links a{margin-right:12px;color:var(--blue);font-weight:600;font-size:13px;text-decoration:none}
  #toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:12px 18px;border-radius:10px;font-size:14px;display:none;z-index:20;max-width:90vw}
  #login{max-width:360px;margin:60px auto;text-align:center}
  #login img{width:150px}
  .hide{display:none}
  .spin{color:var(--muted);padding:30px;text-align:center}
</style>
</head>

<script>

var BEAT_API = 'https://script.google.com/macros/s/AKfycbwjQs8sMjhooLuL2jBmmDls9L30mChNkMzoamSA1tc5zXPy6ay2F88J_eesBWSZCx8Vnw/exec';
var google = { script: { run: (function mk(ok, ko) {
  var api = {
    withSuccessHandler: function (f) { return mk(f, ko); },
    withFailureHandler: function (f) { return mk(ok, f); }
  };
  ['uiLogin', 'uiDashboard', 'uiLeads', 'uiPedidos', 'uiCapture'].forEach(function (fn) {
    api[fn] = function () {
      var args = [].slice.call(arguments);
      fetch(BEAT_API, { method: 'POST', credentials: 'omit', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ action: fn, args: args }) })
        .then(function (r) { return r.json(); })
        .then(function (o) { if (o.ok) { ok && ok(o.data); } else { ko && ko(new Error(o.error)); } })
        .catch(function () { ko && ko(new Error('Sin conexión con el Cerebro. Intenta de nuevo.')); });
    };
  });
  return api;
})(null, null) } };

<script>
var CODE = '', LEADS = [], DASH = null, PEDIDOS = [];
var DEPTOS = [
  {n:'Prospección', c:'#335DAC', a:[['Prospector','Busca 10 PyMEs industriales al día'],['Verificador','Revisa contactos y duplicados']]},
  {n:'Inteligencia de mercado', c:'#4E75B8', a:[['Analista de mercado','Sectores, plantas nuevas, competencia']]},

];

function $(id){return document.getElementById(id)}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function money(n){return '$'+Math.round(n||0).toLocaleString('es-MX')}
function toast(t){var x=$('toast');x.textContent=t;x.style.display='block';clearTimeout(x._t);x._t=setTimeout(function(){x.style.display='none'},3500)}
function call(fn){var args=[].slice.call(arguments,1);return new Promise(function(ok,ko){var r=google.script.run.withSuccessHandler(ok).withFailureHandler(function(e){toast(e.message||e);ko(e)});r[fn].apply(r,args)})}
function store(k,v){try{v===undefined?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}}
function load(k){try{return localStorage.getItem(k)}catch(e){return null}}

function doLogin(c){
  CODE = (c||$('code').value).trim(); if(!CODE) return;
  call('uiLogin',CODE).then(function(u){
    store('beat_code',CODE); $('who').textContent=u.nombre+' · '+(u.rol||'');
    $('login').classList.add('hide'); $('app').classList.remove('hide'); show('tablero');
  }).catch(function(){ $('lerr').textContent='Código no válido'; store('beat_code'); });
}
function logout(){store('beat_code');location.reload()}

document.querySelectorAll('nav button').forEach(function(b){b.onclick=function(){show(b.dataset.v)}});
function show(v){
  document.querySelectorAll('nav button').forEach(function(b){b.classList.toggle('on',b.dataset.v===v)});
  document.querySelectorAll('main section').forEach(function(s){s.classList.toggle('hide',s.id!=='v-'+v)});
  if(v==='tablero'||v==='agentes') loadDash(v);
  if(v==='prospectos') loadLeads().then(renderLeads);
  if(v==='pedidos') loadPedidos();
  if(v==='capturar') renderCapture();
}

/* ---------- Tablero ---------- */
function loadDash(v){
  return call('uiDashboard',CODE).then(function(d){DASH=d; v==='agentes'?renderAgentes():renderDash();});
}
function kpi(n,l,cls,tag){return '<div class="kpi '+(cls||'')+'"><b>'+n+'</b><span>'+l+(tag?'<span class="tag '+cls+'">'+tag+'</span>':'')+'</span></div>'}
function renderDash(){
  var d=DASH,k=d.kpi,max=Math.max.apply(null,Object.values(d.embudo).concat([1]));
  var h='<div class="grid kpis">'+
    kpi(k.leadsHoy,'Prospectos nuevos hoy')+kpi(k.porContactar,'Listos para contactar')+kpi(k.seguimientosHoy,'Seguimientos para hoy')+
    kpi(k.respondieron,'Respondieron')+kpi(k.oportunidades,'Oportunidades abiertas')+kpi(k.pedidosActivos,'Pedidos en curso')+
    kpi(money(k.ventasMesReal),'Ventas del mes','real','REAL')+kpi(money(k.pipelineProy),'Embudo estimado','proy','PROYECCIÓN')+
    '</div><div class="grid two" style="margin-top:12px">';
  h+='<div class="card"><h2>Para hoy</h2>'+(d.pendientes.length?d.pendientes.map(function(p){
      return '<div class="row"><div><b>'+esc(p.empresa)+'</b><br><small>'+esc(p.paso||'Contactar')+'</small></div><small>'+(p.tel?'<a href="tel:'+esc(p.tel)+'">'+esc(p.tel)+'</a>':'')+'</small></div>'}).join(''):'<div class="empty">Nada vencido. 👌</div>')+'</div>';
  h+='<div class="card"><h2>Embudo de prospectos</h2>'+Object.keys(d.embudo).map(function(s){
      return '<div class="bar"><span class="l">'+s+'</span><span class="b" style="width:'+(d.embudo[s]/max*55)+'%"></span><span class="n">'+d.embudo[s]+'</span></div>'}).join('')+'</div>';
  h+='<div class="card"><h2>Prioridad alta sin contactar</h2>'+(d.top.length?d.top.map(function(t){
      return '<div class="row"><div><b>'+esc(t.empresa)+'</b><br><small>'+esc(t.giro)+'</small></div><small>'+esc(t.canal||'')+'</small></div>'}).join(''):'<div class="empty">Sin pendientes de prioridad alta.</div>')+'</div>';
  h+='<div class="card"><h2>Pedidos en curso</h2>'+(d.pedidos.length?d.pedidos.map(function(p){
      return '<div class="row"><div><b>'+esc(p.folio)+' · '+esc(p.empresa)+'</b><br><small>'+esc(p.producto)+'</small></div><div style="text-align:right"><span class="pill p-Baja">'+esc(p.etapa)+'</span><br><small>'+esc(p.fecha)+'</small></div></div>'}).join(''):'<div class="empty">Sin pedidos activos.</div>')+'</div>';
  h+='</div>';
  $('v-tablero').innerHTML=h;
}

/* ---------- Agentes ---------- */
function renderAgentes(){
  var ag=DASH.agentes||{};
  var dir=ag['Director']||ag['Rutina automática (Google)'];
  var h='<div class="ceo"><div class="box">Dirección · Director<br><span style="font-weight:400;font-size:12px;opacity:.8">'+(dir?esc(dir.fecha)+' · '+esc(dir.tarea):'Reparte el trabajo y te da el resumen')+'</span></div></div><div class="org">';
  DEPTOS.forEach(function(dp){
    h+='<div class="dep" style="background:'+dp.c+'"><h3>'+dp.n.toUpperCase()+'</h3>'+dp.a.map(function(a){
      var u=ag[a[0]];
      return '<div class="ag"><b><span class="dot '+(u?'':'off')+'"></span>'+esc(a[0])+'</b>'+esc(a[1])+(u?'<br><span style="opacity:.8">Último: '+esc(u.fecha)+' · '+esc(u.resultado||u.tarea)+'</span>':'')+'</div>'}).join('')+'</div>';
  });
  h+='</div><div class="card" style="margin-top:12px"><h2>Actividad reciente</h2>'+((DASH.actividad||[]).length?DASH.actividad.map(function(a){
    return '<div class="row"><div><b>'+esc(a['Agente'])+'</b> <small>· '+esc(a['Departamento'])+'</small><br><small>'+esc(a['Resultado'])+'</small></div><small>'+esc(a['Fecha'])+'</small></div>'}).join(''):'<div class="empty">Todavía no hay actividad.</div>')+'</div>';
  $('v-agentes').innerHTML=h;
}

/* ---------- Prospectos ---------- */
function loadLeads(){return call('uiLeads',CODE).then(function(l){LEADS=l;return l})}
var LF={q:'',estado:'Activos'};
function renderLeads(){
  var est=['Activos','Mensaje listo','Contactado','Respondió','Interesado','Cliente','Todos'];
  var h='<input placeholder="Buscar empresa o giro…" value="'+esc(LF.q)+'" oninput="LF.q=this.value;drawLeads()"><div class="chips" style="margin:10px 0">'+
    est.map(function(e){return '<span class="chip '+(LF.estado===e?'on':'')+'" onclick="LF.estado=\''+e+'\';renderLeads()">'+e+'</span>'}).join('')+'</div><div id="leadlist"></div>';
  $('v-prospectos').innerHTML=h; drawLeads();
}
function drawLeads(){
  var act=['Nuevo','Mensaje listo','Contactado','Respondió','Interesado'];
  var q=LF.q.toLowerCase();
  var L=LEADS.filter(function(l){
    var okE=LF.estado==='Todos'||(LF.estado==='Activos'?act.indexOf(l.estado)>=0:l.estado===LF.estado);
    return okE&&(!q||(String(l.empresa)+' '+l.giro).toLowerCase().indexOf(q)>=0);
  });
  var order={Alta:0,Media:1,Baja:2}; var rk=function(x){return x in order?order[x]:3};L.sort(function(a,b){return rk(a.prioridad)-rk(b.prioridad)});
  $('leadlist').innerHTML=L.length?L.map(function(l){
    var wa=l.tel?'https://wa.me/52'+String(l.tel).replace(/\D/g,'').slice(-10)+(l.mensaje?'?text='+encodeURIComponent(l.mensaje):''):'';
    return '<div class="lead"><div class="top"><div><div class="n">'+esc(l.empresa)+'</div><div class="m">'+esc(l.giro)+' · '+esc(l.municipio||'')+' · '+esc(l.estado)+'</div></div><span class="pill p-'+esc(l.prioridad)+'">'+esc(l.prioridad||'')+'</span></div>'+
      '<div class="links" style="margin-top:8px">'+(l.tel?'<a href="tel:'+esc(l.tel)+'">📞 Llamar</a>':'')+(wa?'<a target="_blank" href="'+wa+'">💬 WhatsApp</a>':'')+(l.email?'<a href="mailto:'+esc(l.email)+'">✉️ Correo</a>':'')+(l.web?'<a target="_blank" href="'+esc(l.web)+'">🌐 Web</a>':'')+'</div>'+
      '<details><summary>Por qué y qué decirle</summary><p><b>Le sirve:</b> '+esc(l.productos)+'</p><p>'+esc(l.porque)+'</p>'+(l.mensaje?'<pre>'+esc(l.mensaje)+'</pre>':'')+
      '<button class="btn sec" onclick="quick(\''+l.id+'\',\'enviado\')">Ya le envié el mensaje</button><button class="btn sec" onclick="quick(\''+l.id+'\',\'respuesta\')">Registrar su respuesta</button></details></div>';
  }).join(''):'<div class="empty">Sin prospectos en este filtro.</div>';
}
function quick(id,tipo){show('capturar');pick(tipo,id)}

/* ---------- Pedidos ---------- */
function loadPedidos(){
  call('uiPedidos',CODE).then(function(p){PEDIDOS=p;
    $('v-pedidos').innerHTML='<button class="btn" style="margin-top:0" onclick="show(\'capturar\');pick(\'pedido\')">+ Nuevo pedido</button><div style="margin-top:12px">'+(p.length?p.map(function(x){
      return '<div class="lead"><div class="top"><div><div class="n">'+esc(x['Folio'])+' · '+esc(x['Empresa'])+'</div><div class="m">'+esc(x['Producto'])+' · '+esc(x['Cantidad'])+' · compromiso '+esc(x['Fecha compromiso']||'sin fecha')+'</div></div><span class="pill p-Baja">'+esc(x['Etapa'])+'</span></div>'+
        '<button class="btn sec" onclick="show(\'capturar\');pick(\'etapa\',null,\''+esc(x['Folio'])+'\')">Cambiar etapa</button></div>'}).join(''):'<div class="empty">Sin pedidos activos.</div>')+'</div>';
  });
}

/* ---------- Capturar ---------- */
var ACTS=[['enviado','📤','Ya envié mensaje'],['respuesta','💬','Cliente respondió'],['contacto','📞','Llamada o visita'],['pedido','📦','Llegó un pedido'],['etapa','🚚','Avance de pedido'],['lead','➕','Prospecto nuevo'],['nota','📝','Nota rápida']];
function renderCapture(){
  $('v-capturar').innerHTML='<div class="grid actions">'+ACTS.map(function(a){return '<div class="act" id="act-'+a[0]+'" onclick="pick(\''+a[0]+'\')"><span class="i">'+a[1]+'</span>'+a[2]+'</div>'}).join('')+'</div><div id="form" class="card" style="margin-top:12px;display:none"></div>';
  if(!LEADS.length) loadLeads();
}
function leadSelect(sel){
  var opts=LEADS.slice().sort(function(a,b){return String(a.empresa).localeCompare(b.empresa)}).map(function(l){return '<option value="'+esc(l.id)+'" '+(l.id===sel?'selected':'')+'>'+esc(l.empresa)+'</option>'}).join('');
  return '<label>Empresa</label><select id="f-lead"><option value="">— Elegir —</option>'+opts+'</select>';
}
function chipsField(id,arr,sel){return '<div class="chips" id="'+id+'">'+arr.map(function(x){return '<span class="chip '+(x===sel?'on':'')+'" onclick="this.parentNode.querySelectorAll(\'.chip\').forEach(function(c){c.classList.remove(\'on\')});this.classList.add(\'on\')">'+x+'</span>'}).join('')+'</div>'}
function chipVal(id){var c=document.querySelector('#'+id+' .chip.on');return c?c.textContent:''}
function pick(t,leadId,folio){
  if(!$('form')) renderCapture();
  var go=function(){
    document.querySelectorAll('.act').forEach(function(a){a.classList.toggle('on',a.id==='act-'+t)});
    var f=$('form'),h='';
    if(t==='enviado') h=leadSelect(leadId)+'<label>Por dónde</label>'+chipsField('f-canal',['WhatsApp','Email','Llamada','LinkedIn'],'WhatsApp')+'<label>Comentario (opcional)</label><textarea id="f-det"></textarea>';
    if(t==='respuesta') h=leadSelect(leadId)+'<label>¿Qué dijo?</label>'+chipsField('f-res',['Quiere cotización','Pide más información','Llamar después','No le interesa','Hizo pedido'])+'<label>Fecha para volver a llamar (si aplica)</label><input type="date" id="f-fecha"><label>Por dónde</label>'+chipsField('f-canal',['WhatsApp','Email','Llamada','Visita'],'WhatsApp')+'<label>Detalle (qué producto, medidas, volumen…)</label><textarea id="f-det"></textarea>';
    if(t==='contacto') h=leadSelect(leadId)+'<label>Tipo</label>'+chipsField('f-sub',['Llamada','Visita','Muestra enviada','Queja'],'Llamada')+'<label>¿Qué pasó?</label><textarea id="f-det"></textarea>';
    if(t==='pedido') h=leadSelect(leadId)+'<label>O empresa nueva (si no está en la lista)</label><input id="f-emp"><label>Producto</label><input id="f-prod" placeholder="Ej. caja corrugado doble 40x30x30"><label>Cantidad</label><input id="f-cant"><label>Fecha compromiso de entrega</label><input type="date" id="f-fecha"><label>Notas</label><textarea id="f-det"></textarea>';
    if(t==='etapa') h='<label>Pedido</label><select id="f-folio">'+PEDIDOS.map(function(p){return '<option '+(p['Folio']===folio?'selected':'')+' value="'+esc(p['Folio'])+'">'+esc(p['Folio'])+' · '+esc(p['Empresa'])+'</option>'}).join('')+'</select><label>Nueva etapa</label>'+chipsField('f-etapa',['Confirmado','En producción','Listo','En ruta','Entregado','Facturado','Cancelado'])+'<label>Notas</label><textarea id="f-det"></textarea>';
    if(t==='lead') h='<label>Empresa</label><input id="f-emp"><label>Giro</label><input id="f-giro"><label>Contacto (nombre / puesto)</label><input id="f-cont"><label>Teléfono</label><input id="f-tel" inputmode="tel"><label>Correo</label><input id="f-mail" inputmode="email"><label>¿Cómo llegó o qué necesita?</label><textarea id="f-det"></textarea>';
    if(t==='nota') h=leadSelect(leadId)+'<label>Nota</label><textarea id="f-det"></textarea>';
    f.innerHTML=h+'<button class="btn" id="f-go" onclick="send(\''+t+'\')">Guardar</button>'; f.style.display='block'; f.scrollIntoView({behavior:'smooth'});
  };
  if(t==='etapa'&&!PEDIDOS.length) call('uiPedidos',CODE).then(function(p){PEDIDOS=p;go()}); else if(!LEADS.length&&t!=='lead') loadLeads().then(go); else go();
}
function v(id){var e=$(id);return e?e.value.trim():''}
function send(t){
  var d={tipo:t,leadId:v('f-lead'),detalle:v('f-det'),canal:chipVal('f-canal'),fecha:v('f-fecha')};
  if(t==='respuesta') d.resultado=chipVal('f-res');
  if(t==='contacto') d.subtipo=chipVal('f-sub');
  if(t==='pedido'){d.empresa=v('f-emp');d.producto=v('f-prod');d.cantidad=v('f-cant');}
  if(t==='etapa'){d.folio=v('f-folio');d.etapa=chipVal('f-etapa');}
  if(t==='lead'){d.empresa=v('f-emp');d.giro=v('f-giro');d.contacto=v('f-cont');d.tel=v('f-tel');d.email=v('f-mail');}
  if(['enviado','respuesta','contacto'].indexOf(t)>=0&&!d.leadId) return toast('Elige la empresa');
  if(t==='respuesta'&&!d.resultado) return toast('Elige qué dijo');
  if(t==='pedido'&&!d.leadId&&!d.empresa) return toast('Elige o escribe la empresa');
  if(t==='etapa'&&!d.etapa) return toast('Elige la etapa');
  if(t==='lead'&&!d.empresa) return toast('Escribe la empresa');
  $('f-go').disabled=true; $('f-go').textContent='Guardando…';
  call('uiCapture',CODE,d).then(function(msg){toast('✅ '+msg);LEADS=[];PEDIDOS=[];$('form').style.display='none';document.querySelectorAll('.act').forEach(function(a){a.classList.remove('on')});loadLeads();})
    .catch(function(){$('f-go').disabled=false;$('f-go').textContent='Guardar'});
}

var saved=load('beat_code'); if(saved) doLogin(saved);
$('code').addEventListener('keydown',function(e){if(e.key==='Enter')doLogin()});
</script>
</body>
</html>
